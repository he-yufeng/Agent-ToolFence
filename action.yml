name: "agentcikit CI gate"
description: >-
  Run one agentcikit tool (mcp-gate, tool-fence, or ci-repro) on a pull request
  and post the report as a sticky comment.
author: "he-yufeng"
branding:
  icon: shield
  color: blue

inputs:
  tool:
    description: "Which tool to run: mcp-gate, tool-fence, or ci-repro."
    required: true
  args:
    description: "Extra CLI arguments for the tool (server command, fixture paths, log file, flags)."
    required: false
    default: ""
  package:
    description: "Pip install spec for agentcikit (PyPI name, version pin, or . for repo checkout)."
    required: false
    default: "agentcikit"
  python-version:
    description: "Python version for the tool runtime."
    required: false
    default: "3.12"
  comment:
    description: "Post or update a sticky PR comment with the report."
    required: false
    default: "true"
  github-token:
    description: "Token used to post the PR comment."
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    - name: Install agentcikit
      shell: bash
      run: python -m pip install "${{ inputs.package }}"

    - name: Run ${{ inputs.tool }}
      shell: bash
      id: run
      env:
        AGENTCI_TOOL: ${{ inputs.tool }}
        AGENTCI_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        report="agentci-report.md"
        case "$AGENTCI_TOOL" in
          mcp-gate)
            agentci mcp-gate $AGENTCI_ARGS --report "$report"
            ;;
          tool-fence)
            agentci tool-fence $AGENTCI_ARGS --markdown > "$report"
            ;;
          ci-repro)
            agentci ci-repro $AGENTCI_ARGS --out "$report"
            ;;
          *)
            echo "::error::unknown tool '$AGENTCI_TOOL' (expected mcp-gate, tool-fence, or ci-repro)"
            exit 1
            ;;
        esac
        test -s "$report"
        echo "report=$report" >> "$GITHUB_OUTPUT"

    - name: Comment the report on the PR
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const marker = "<!-- agentcikit-report -->";
          const body = `${marker}\n${fs.readFileSync("${{ steps.run.outputs.report }}", "utf8")}`;
          const {owner, repo, number} = context.issue;
          const {data: comments} = await github.rest.issues.listComments({
            owner, repo, issue_number: number, per_page: 100,
          });
          const existing = comments.find(
            (c) => c.user.type === "Bot" && c.body.includes(marker),
          );
          if (existing) {
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({owner, repo, issue_number: number, body});
          }
